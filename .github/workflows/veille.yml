name: Veille prix vols

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chercher:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer la recherche
        run: python chercher_vols.py

      - name: Enregistrer les resultats dans le depot
        run: |
          git config user.name "veille-vols"
          git config user.email "actions@github.com"
          git add donnees.json RESULTATS.md historique.csv
          if git diff --staged --quiet; then
            echo "Aucun changement de prix, rien a enregistrer."
          else
            git commit -m "Prix mis a jour ($(date -u '+%d/%m/%Y %H:%M') UTC)"
            git push
          fi
