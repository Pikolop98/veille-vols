# ============================================================
#  LE SEUL FICHIER A MODIFIER
# ============================================================
# Ici tu definis ce que le robot va RATISSER chaque matin.
# Le tri fin (partir apres telle date, sejour de tant de jours)
# se fait ensuite directement sur la page web, sans attendre.

# Codes d'AEROPORT a 3 lettres, pas de ville.
# CDG Roissy, ORY Orly, BVA Beauvais, NCE Nice, LYS Lyon
# FOR Fortaleza, REC Recife, NAT Natal, GRU Sao Paulo
# PAR couvre Roissy + Orly + Beauvais d'un coup, comme le fait Google
# quand tu tapes "Paris". C'est ce qui manquait : les vols au depart
# d'Orly etaient invisibles.
origine: PAR

# Une ou plusieurs destinations. Chaque ligne commence par un tiret.
# ATTENTION : le temps de recherche est multiplie par leur nombre.
# 1 destination = ~40 min. 2 = ~80 min. 3 = ~2 h.
# Au-dela de 3, reduis la fenetre de dates ou max_requetes.
destinations:
  - FOR
# - REC
# - NAT

# Fenetre ratissee. Prends large : tu affineras sur la page.
depart_le_plus_tot: 2026-08-15
depart_le_plus_tard: 2026-09-15

# Durees de sejour visees, en jours
durees_jours: [30, 60]

# Marge autour de ces durees, et par quel pas la balayer.
# tolerance 2 + pas 2 donne : 28, 30, 32 et 58, 60, 62 jours.
# tolerance 4 + pas 1 donne 26,27,28...34 et 56,57...64 jours,
# soit 18 durees au lieu de 6. La grille est bien plus fine.
tolerance_jours: 4
pas_tolerance: 1

# Plafond de securite. Au-dela, le robot echantillonne.
# Plafond de la phase aller-retour uniquement.
max_requetes: 170

# Pause entre deux interrogations. Sous 8 secondes, Google
# commence a ne plus repondre : c'est teste, ne descends pas.
pause_secondes: 8

# Au-dela de cette duree de sejour, Google ne renvoie plus rien en
# aller-retour. Le robot bascule alors sur deux allers simples.
# Verifie sur ton journal : le seuil observe est 30 jours.
seuil_aller_retour: 30

# Devise des prix demandes a Google
devise: EUR

# ---------------- BAGAGES ----------------
# Les low-cost ne sont plus supprimees : elles sont marquees,
# et tu les masques ou les affiches d'un clic sur la page.
# Ce reglage ne sert plus qu'aux fichiers texte de secours.
exclure_low_cost: true

compagnies_low_cost:
  - Ryanair
  - Wizz Air
  - easyJet
  - Transavia
  - Vueling
  - Eurowings
  - Volotea
  - Pegasus
  - Norwegian
  - Norse Atlantic
  - Scoot
  - AirAsia
  - Jetstar
  - Cebu Pacific
  - VietJet
  - Air Arabia
  - Spirit
  - Frontier
  - Allegiant

# Lignes affichees dans le RESULTATS.md de secours
nombre_de_resultats: 20
