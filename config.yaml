# ============================================================
#  C'EST LE SEUL FICHIER QUE TU AURAS BESOIN DE MODIFIER
# ============================================================

# ATTENTION : cette version interroge Google Flights, qui veut des codes
# d'AEROPORT, pas de ville. Ecris CDG (et non PAR), ORY, BVA, NCE, LYS...
origine: CDG
destination: FOR

# Fenetre de depart : n'importe quel jour entre ces deux dates
depart_le_plus_tot: 2026-08-18
depart_le_plus_tard: 2026-08-31

# Durees de sejour recherchees, en jours
durees_jours: [30, 60]

# Tolerance autour de ces durees.
# ATTENTION : chaque jour de tolerance multiplie le nombre de requetes.
# 0 = 28 requetes. 1 = 84 requetes. 3 = 196 requetes.
# Google bloque si on l'interroge trop : reste bas.
tolerance_jours: 0

# Plafond de securite. Au-dela, le script echantillonne au lieu de tout tester.
max_requetes: 60

# Pause entre deux interrogations, en secondes. Ne descends pas sous 2.
pause_secondes: 3

# true = uniquement les vols sans escale
vols_directs_uniquement: false

# ---------------- BAGAGES ----------------
# Google ne transmet pas non plus le detail bagage. On filtre par compagnie.
exclure_low_cost: true
compagnies_low_cost:
  - Ryanair
  - Wizz Air
  - easyJet
  - Transavia
  - Vueling
  - Eurowings
  - Volotea
  - Pegasus
  - Norwegian
  - Norse Atlantic
  - Scoot
  - AirAsia
  - Jetstar
  - Cebu Pacific
  - VietJet
  - Air Arabia
  - Spirit
  - Frontier
  - Allegiant

# Nombre de lignes affichees dans le tableau
nombre_de_resultats: 20
